name: Test Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_FILE: .nvmrc
  CI_BASE_URL: http://127.0.0.1:3000
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  BASE_URL: http://127.0.0.1:3000
  NUXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  CONVEX_SITE_URL: http://127.0.0.1:3000
  ENABLE_CONTRACT_TESTS: ${{ vars.ENABLE_CONTRACT_TESTS || 'false' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CI-only auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Verify static rows, Vitest and production build
        run: pnpm verify

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-output
          include-hidden-files: true
          path: .quality-output/
          retention-days: 14

  test:
    name: Playwright (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate CI-only auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build, start preview, and run shard
        run: |
          set -euo pipefail

          pnpm build
          pnpm preview --host 127.0.0.1 --port 3000 > /tmp/cadet2-preview.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --silent --fail "$CI_BASE_URL" > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --silent --fail "$CI_BASE_URL" > /dev/null
          pnpm exec playwright test --project=chromium --project=api --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  contract_test:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: ${{ needs.test.result == 'success' }}
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
      PACTICIPANT_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect contract test readiness
        id: ready
        run: |
          set -euo pipefail

          if [ "$ENABLE_CONTRACT_TESTS" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Contract testing is disabled. Set ENABLE_CONTRACT_TESTS=true when Pact is wired."
            exit 0
          fi

          if [ -z "${PACT_BROKER_BASE_URL:-}" ] || [ -z "${PACT_BROKER_TOKEN:-}" ]; then
            echo "PACT_BROKER_BASE_URL and PACT_BROKER_TOKEN are required when contract tests are enabled."
            exit 1
          fi

          node -e "const scripts = (require('./package.json').scripts) || {}; if (!scripts['test:contract:consumer'] || !scripts['test:contract:provider']) process.exit(1)"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        if: ${{ steps.ready.outputs.ready == 'true' }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run consumer contract tests and publish pacts
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          pnpm run test:contract:consumer
          npx pact-broker publish ./pacts --consumer-app-version="$GITHUB_SHA" --branch="$GITHUB_BRANCH"

      - name: Run provider verification
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: pnpm run test:contract:provider

      - name: Can I Deploy gate
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: npx pact-broker can-i-deploy --pacticipant="$PACTICIPANT_NAME" --version="$GITHUB_SHA" --to-environment=production --retry-while-unknown 6 --retry-interval 10

  burn_in:
    name: Burn-In
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [test, contract_test]
    if: ${{ needs.test.result == 'success' && needs.contract_test.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'schedule') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Collect changed specs
        id: changed
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref || 'dev' }}"
          git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
          CHANGED_SPECS="$(./scripts/test-changed.sh "$BASE_REF" | tr '\n' ' ')"
          printf 'specs=%s\n' "$CHANGED_SPECS" >> "$GITHUB_OUTPUT"

      - name: Generate CI-only auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build, start preview, and run burn-in
        run: |
          set -euo pipefail

          pnpm build
          pnpm preview --host 127.0.0.1 --port 3000 > /tmp/cadet2-burn-in-preview.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --silent --fail "$CI_BASE_URL" > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --silent --fail "$CI_BASE_URL" > /dev/null
          ./scripts/burn-in.sh 10 ${{ steps.changed.outputs.specs }}

      - name: Upload burn-in artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: burn-in-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [verify, test, contract_test, burn_in]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Download collected artifacts
        if: ${{ needs.test.result != 'skipped' || needs.burn_in.result != 'skipped' }}
        uses: actions/download-artifact@v8.0.2
        with:
          path: ci-artifacts
          pattern: '*artifacts*'
          merge-multiple: false

      - name: Write workflow summary
        run: |
          {
            echo "## Test Pipeline Summary"
            echo
            echo "- verify: ${{ needs.verify.result }}"
            echo "- test: ${{ needs.test.result }}"
            echo "- contract_test: ${{ needs.contract_test.result }}"
            echo "- burn_in: ${{ needs.burn_in.result }}"
            echo
            echo "Artifacts are bundled with this workflow run when test or burn-in jobs execute."
            echo "Contract tests stay dormant until ENABLE_CONTRACT_TESTS=true, Pact secrets exist, and contract scripts are added."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated artifacts bundle
        if: ${{ needs.test.result != 'skipped' || needs.burn_in.result != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-artifacts-bundle
          path: ci-artifacts/
          retention-days: 14

      - name: Notify Slack on failure
        if: ${{ env.SLACK_WEBHOOK_URL != '' && (needs.verify.result == 'failure' || needs.test.result == 'failure' || needs.contract_test.result == 'failure' || needs.burn_in.result == 'failure') }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          MESSAGE="cadet2 test pipeline failed. Review run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(printf '{"text":"%s"}' "$MESSAGE")
          curl --silent --show-error --fail -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
